<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRAINPP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10101c;color:white;font-family:Arial;text-align:center;padding:18px}
h1{color:#a875ff;font-size:38px}
.balance{background:#24243b;padding:15px;border-radius:15px;font-size:22px;margin:15px 0}
.cases,.collection{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.case,.item{background:#24243b;border-radius:15px;padding:15px;margin-bottom:10px}
.case{border:1px solid #7552b9}
button{background:#8955e8;color:white;border:0;border-radius:10px;padding:12px;font-size:16px;margin:5px;cursor:pointer}
button:disabled{background:#555;color:#aaa}
.emoji{font-size:45px}
#result{font-size:22px;margin:20px}
h2{margin-top:30px}
</style>
</head>
<body>

<h1>🧠 BRAINPP</h1>
<div class="balance">🪙 Баланс: <span id="coins">0</span> монет</div>

<h2>🎁 Кейсы</h2>
<div class="cases">
 <div class="case">
  <div class="emoji">🎁</div>
  <h3>Обычный кейс</h3>
  <p>100 монет</p>
  <button onclick="openCase('normal')">Открыть</button>
 </div>
 <div class="case">
  <div class="emoji">🐉</div>
  <h3>Секретный кейс</h3>
  <p>500 монет</p>
  <button onclick="openCase('secret')">Открыть</button>
 </div>
 <div class="case">
  <div class="emoji">🎁</div>
  <h3>Бесплатный кейс</h3>
  <p>Раз в 24 часа</p>
  <button onclick="openFree()">Открыть</button>
 </div>
</div>

<div id="result"></div>

<h2>📦 Моя коллекция</h2>
<div class="collection" id="collection"></div>

<script>
const brainrots = [
 {name:"Тунг Тунг Тунг Сахур",emoji:"🪵",price:25},
 {name:"Бомбардиро Крокодило",emoji:"🐊",price:50},
 {name:"Тралалеро Тралала",emoji:"🦈",price:75},
 {name:"Бомбини Гусини",emoji:"🪿",price:100},
 {name:"Лирили Ларила",emoji:"🐘",price:150},
 {name:"Капучино Ассасино",emoji:"☕",price:200},
 {name:"Тайный Брейнрот",emoji:"👑",price:500}
];

let coins = Number(localStorage.getItem("brainpp_coins") || 0);
let collection = JSON.parse(localStorage.getItem("brainpp_collection") || "[]");

function save(){
 localStorage.setItem("brainpp_coins",coins);
 localStorage.setItem("brainpp_collection",JSON.stringify(collection));
 render();
}
function render(){
 document.getElementById("coins").textContent=coins;
 let area=document.getElementById("collection");
 area.innerHTML="";
 if(collection.length===0){
  area.innerHTML="<p>Коллекция пока пуста</p>";
 }
 collection.forEach((item,index)=>{
  let div=document.createElement("div");
  div.className="item";
  div.innerHTML=`<div class="emoji">${item.emoji}</div>
  <b>${item.name}</b><p>Цена: ${item.price} монет</p>
  <button onclick="sell(${index})">Продать</button>`;
  area.appendChild(div);
 });
}

function openCase(type){
 let cost=type==="secret"?500:100;
 if(coins<cost){
  document.getElementById("result").textContent="❌ Недостаточно монет!";
  return;
 }
 coins-=cost;
 let item;
 if(type==="secret"){
  item=brainrots[6];
 }else{
  item=brainrots[Math.floor(Math.random()*6)];
 }
 collection.push({...item});
 save();
 document.getElementById("result").textContent=
 "🎉 Выпал: "+item.emoji+" "+item.name+"!";
}

function openFree(){
  let username="";
 let profileName="";
 try{
  const user=window.Telegram.WebApp.initDataUnsafe.user||{};
  username=user.username||"";
  profileName=[user.first_name||"",user.last_name||""].join(" ");
 }catch(e){}
 if(!(username+" "+profileName).toLowerCase().includes("brainpp")){
  document.getElementById("result").textContent=
  "❌ В имени или username Telegram должно быть слово brainpp!";
  return;
 }
 
 let last=Number(localStorage.getItem("brainpp_free_time")||0);
 if(Date.now()-last<86400000){
  document.getElementById("result").textContent=
  "⏳ Бесплатный кейс доступен раз в 24 часа.";
  return;
 }
 localStorage.setItem("brainpp_free_time",Date.now());
 let item=brainrots[Math.floor(Math.random()*6)];
 collection.push({...item});
 save();
 document.getElementById("result").textContent=
 "🎉 Бесплатный кейс! Выпал: "+item.emoji+" "+item.name+"!";
}

function sell(index){
 coins+=collection[index].price;
 let name=collection[index].name;
 collection.splice(index,1);
 save();
 document.getElementById("result").textContent=
 "💰 Ты продал "+name+"!";
}

render();
</script>
</body>
</html>
